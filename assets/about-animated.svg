<svg width="1400" height="360" viewBox="0 0 1400 360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="l1"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;760;760;760" keyTimes="0;0.10;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;0;640;640;640" keyTimes="0;0.10;0.20;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;0;0;700;700;700" keyTimes="0;0.20;0.30;0.40;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;0;0;0;690;690;690" keyTimes="0;0.30;0.40;0.50;0.60;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;0;0;0;0;610;610;610" keyTimes="0;0.40;0.50;0.60;0.70;0.80;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" height="20"><animate attributeName="width" values="0;0;0;0;0;0;520;520;520" keyTimes="0;0.55;0.65;0.72;0.78;0.85;0.90;0.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- terminal card -->
  <rect x="0" y="0" width="820" height="360" fill="url(#termBg)" stroke="#1c2b45" stroke-width="1"/>
  <rect x="0" y="0" width="820" height="34" fill="#0d1626"/>
  <rect x="0" y="0" width="820" height="34" fill="none" stroke="#1c2b45" stroke-width="1"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="5" fill="#27c93f"/>
  <text x="410" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4b6485" text-anchor="middle">vivek@agentic-ai: ~/init_profile</text>

  <g font-family="'JetBrains Mono', monospace" font-size="14.5" fill="#8fa5c9">
    <g clip-path="url(#l1)"><text x="30" y="66">$ ./init_profile.sh --verbose</text></g>
    <g clip-path="url(#l2)"><text x="30" y="98"><tspan fill="#4b6485">[ 0.014s ]</tspan>  Loading education .......... JNTUH, B.Tech CSE</text></g>
    <g clip-path="url(#l3)"><text x="30" y="130"><tspan fill="#4b6485">[ 0.032s ]</tspan>  Mounting focus areas ........ agentic-ai · retrieval-rag · mlops</text></g>
    <g clip-path="url(#l4)"><text x="30" y="162"><tspan fill="#4b6485">[ 0.047s ]</tspan>  Init agent runtime .......... LangGraph orchestration <tspan fill="#22d3ee">OK</tspan></text></g>
    <g clip-path="url(#l5)"><text x="30" y="194"><tspan fill="#4b6485">[ 0.061s ]</tspan>  Retrieval pipeline .......... hybrid BM25+dense+rerank <tspan fill="#22d3ee">OK</tspan></text></g>
    <g clip-path="url(#l6)"><text x="30" y="226"><tspan fill="#4b6485">[ 0.089s ]</tspan>  Integrity check ............. claims vs. tests <tspan fill="#22d3ee">PASSED</tspan></text></g>
  </g>

  <text x="30" y="270" font-family="'JetBrains Mono', monospace" font-size="14.5" fill="#f1f6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.85;0.90;0.95;0.98;1" dur="9s" repeatCount="indefinite"/>
    [ READY ]  status: open_to_opportunities
  </text>
  <text x="30" y="296" font-family="'JetBrains Mono', monospace" font-size="14.5" fill="#f1f6ff" opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.85;0.90;0.95;0.98;1" dur="9s" repeatCount="indefinite"/>
    [ READY ]  seeking: ai/ml engineer, data scientist
  </text>

  <rect x="30" y="322" width="10" height="16" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.55;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- divider -->
  <line x1="820" y1="0" x2="820" y2="360" stroke="#1c2b45" stroke-width="1"/>

  <!-- agent hand-off node graph -->
  <rect x="820" y="0" width="580" height="360" fill="#080d18"/>
  <text x="1110" y="40" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#4b6485" text-anchor="middle">AGENT MESSAGE BUS — LIVE</text>

  <g stroke="#22314c" stroke-width="1.4" fill="none">
    <path id="edge1" d="M 900 190 L 1060 100"/>
    <path id="edge2" d="M 900 190 L 1060 190"/>
    <path id="edge3" d="M 900 190 L 1060 280"/>
    <path id="edge4" d="M 1060 100 L 1240 150"/>
    <path id="edge5" d="M 1060 190 L 1240 150"/>
    <path id="edge6" d="M 1060 280 L 1240 150"/>
  </g>

  <g fill="#0f1b2f" stroke="#3b6ea5" stroke-width="1.5">
    <circle cx="900" cy="190" r="16"/>
    <circle cx="1060" cy="100" r="14"/>
    <circle cx="1060" cy="190" r="14"/>
    <circle cx="1060" cy="280" r="14"/>
    <circle cx="1240" cy="150" r="16"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#8fa5c9" text-anchor="middle">
    <text x="900" y="222">Planner</text>
    <text x="1060" y="80">Retriever</text>
    <text x="1060" y="212">Executor</text>
    <text x="1060" y="312">Verifier</text>
    <text x="1240" y="182">Evidence</text>
  </g>

  <!-- pulsing signal dots traveling the edges -->
  <circle r="5" fill="#22d3ee" filter="url(#nodeGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge1" xlink:href="#edge1"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#22d3ee" filter="url(#nodeGlow)">
    <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge2" xlink:href="#edge2"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#22d3ee" filter="url(#nodeGlow)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge3" xlink:href="#edge3"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#6366f1" filter="url(#nodeGlow)">
    <animateMotion dur="2s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge4" xlink:href="#edge4"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#6366f1" filter="url(#nodeGlow)">
    <animateMotion dur="2s" begin="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge5" xlink:href="#edge5"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#6366f1" filter="url(#nodeGlow)">
    <animateMotion dur="2s" begin="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#edge6" xlink:href="#edge6"/>
    </animateMotion>
  </circle>

  <!-- pulsing ring on planner node -->
  <circle cx="900" cy="190" r="16" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="16;30;16" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="820" y="0" width="580" height="360" fill="none" stroke="#1c2b45" stroke-width="1"/>
</svg>
